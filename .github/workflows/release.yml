# Builds the plugin from the pushed tag and publishes the release from CI,
# with a build-provenance attestation, so the trust anchor for what BRAT
# installs is this workflow and the tag, not a laptop. Tag = manifest version.
name: release
on:
  push:
    tags: ["[0-9]*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Build
        working-directory: plugin
        run: |
          npm ci
          npm run check
          npm run build
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "${{ github.ref_name }}" ] || { echo "manifest.json says $v, tag is ${{ github.ref_name }}"; exit 1; }
          sha256sum main.js manifest.json styles.css | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: plugin
        run: |
          notes="Built by GitHub Actions from tag ${{ github.ref_name }} (commit ${{ github.sha }}); provenance attested. Install or update with BRAT: instantcocoa/obsidian-sync."
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "obsync ${{ github.ref_name }}" --notes "$notes" main.js manifest.json styles.css SHA256SUMS
